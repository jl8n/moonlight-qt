name: Build Flatpak

# Builds this branch with the Flathub manifest (flatpak/) in Flathub's own CI image,
# producing a bundle that installs over the Flathub app of the same id.
on:
  push:
    branches: [steam-controller-passthrough]
  workflow_dispatch:

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: moonlight.flatpak
          manifest-path: flatpak/com.moonlight_stream.Moonlight.json
          cache-key: flatpak-builder-${{ hashFiles('flatpak/*') }}
